name: Golden production acceptance

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "UUID de um projeto descartável do AD Studio"
        required: true
        type: string
      production_url:
        description: "URL de produção"
        required: false
        default: "https://nexaform-rho.vercel.app"
        type: string

permissions:
  contents: read

concurrency:
  group: golden-production-acceptance
  cancel-in-progress: false

jobs:
  golden:
    name: 5 fluxos reais de geração
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRODUCTION_URL: ${{ inputs.production_url }}
      AD_GOLDEN_PROJECT_ID: ${{ inputs.project_id }}
      AD_GOLDEN_SERVICE_SECRET: ${{ secrets.AD_GOLDEN_SERVICE_SECRET }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar avaliador e runtime
        run: npm ci

      - name: Verificar credencial de serviço
        shell: bash
        run: |
          if [ -z "$AD_GOLDEN_SERVICE_SECRET" ]; then
            echo "::error::Configure uma única vez o secret AD_GOLDEN_SERVICE_SECRET com o mesmo valor usado na Vercel."
            exit 1
          fi

      - name: Executar golden suite real
        run: node scripts/golden-production.mjs

      - name: Instalar Chromium do Golden 2.0
        run: npx playwright install --with-deps chromium

      - name: Compilar e exercitar os cinco apps gerados
        env:
          E2E_TEST_MODE: "1"
          GOLDEN_FIXTURE_PATH: artifacts/golden-apps.json
          GOLDEN_RUNTIME_API_URL: ${{ inputs.production_url }}
        run: npx playwright test tests/e2e/golden-generated.spec.ts

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-production-report
          path: |
            artifacts/golden-production.json
            artifacts/golden-apps.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar evidências do runtime em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-runtime-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
