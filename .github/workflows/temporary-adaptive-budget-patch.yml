name: Temporary adaptive budget patch

on:
  push:
    branches:
      - fix/openrouter-adaptive-budget

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply adaptive budgets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/lib/engine/code-providers.ts')
          s = p.read_text()

          old_import = 'import { CostMode, pickTier, modelExecutionPlan, estimateCost, isFunctionalRefinement } from "./models";'
          new_import = 'import { BUDGET_MODEL_OPENROUTER, FREE_MODEL_OPENROUTER, CostMode, pickTier, modelExecutionPlan, estimateCost, isFunctionalRefinement } from "./models";'
          if s.count(old_import) != 1:
              raise SystemExit('models import anchor mismatch')
          s = s.replace(old_import, new_import, 1)

          budget_block = '''export function modelOutputTokenBudget(message: string, hasCurrentProject: boolean, model: string): number {
            const isStaged = /(?:CONSTRUÇÃO|REFINAMENTO) POR ETAPAS|RECUPERAÇÃO AUTOMÁTICA/.test(message);
            if (model === BUDGET_MODEL_OPENROUTER) {
              if (isStaged && hasCurrentProject) return 2_200;
              if (isStaged) return 3_200;
              if (hasCurrentProject) return 2_500;
              return 7_000;
            }
            if (model === FREE_MODEL_OPENROUTER) {
              if (isStaged && hasCurrentProject) return 1_800;
              if (isStaged) return 2_400;
              if (hasCurrentProject) return 2_000;
              return 4_500;
            }
            if (isStaged && hasCurrentProject) return 3_000;
            if (isStaged) return 4_500;
            if (hasCurrentProject) return 4_000;
            return 24_000;
          }

          function maxOutputTokens(a: Args, model: string): number {
            return modelOutputTokenBudget(a.message, !!(a.currentFiles?.length || a.currentCode), model);
          }'''
          s, n = re.subn(
              r'/\*\* Não reserva 24k tokens[\s\S]*?function maxOutputTokens\(a: Args\): number \{[\s\S]*?\n\}',
              lambda _: '/** Orçamento de saída por etapa E por modelo. Modelos baratos não herdam\n * o teto de 24k do Sonnet, evitando HTTP 402 causado só pela reserva máxima. */\n' + budget_block,
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'maxOutputTokens patch mismatch: {n}')

          timeout_block = '''function providerTimeoutMs(a: Args, repair = false, model = ""): number {
            const isRefinement = !!(a.currentFiles?.length || a.currentCode);
            const isStaged = /(?:CONSTRUÇÃO|REFINAMENTO) POR ETAPAS|RECUPERAÇÃO AUTOMÁTICA/.test(a.message);
            if (model === FREE_MODEL_OPENROUTER) {
              if (isStaged) return repair ? 25_000 : 40_000;
              if (isRefinement) return repair ? 30_000 : 45_000;
              return repair ? 35_000 : 60_000;
            }
            if (model === BUDGET_MODEL_OPENROUTER) {
              if (isStaged) return repair ? 50_000 : 90_000;
              if (isRefinement) return repair ? 50_000 : 80_000;
              return repair ? 60_000 : 150_000;
            }
            if (isStaged) return repair ? 50_000 : 80_000;
            if (isRefinement) return repair ? 60_000 : 90_000;
            if (repair) return 70_000;
            return 180_000;
          }'''
          s, n = re.subn(
              r'function providerTimeoutMs\(a: Args, repair = false\): number \{[\s\S]*?\n\}',
              lambda _: timeout_block,
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'providerTimeout patch mismatch: {n}')

          # Model-aware max token budgets in direct Anthropic and OpenRouter bodies.
          if s.count('max_tokens: maxOutputTokens(a),') != 2:
              raise SystemExit(f'max token call count mismatch: {s.count("max_tokens: maxOutputTokens(a),")}')
          s = s.replace('max_tokens: maxOutputTokens(a),', 'max_tokens: maxOutputTokens(a, model),')

          # Default send timeout becomes model-aware in both providers.
          if s.count('const send = (messages: any[], timeoutMs = providerTimeoutMs(a)) => fetch(') != 2:
              raise SystemExit('send timeout anchors mismatch')
          s = s.replace(
              'const send = (messages: any[], timeoutMs = providerTimeoutMs(a)) => fetch(',
              'const send = (messages: any[], timeoutMs = providerTimeoutMs(a, false, model)) => fetch(',
          )
          # Repair timeouts in both providers.
          s = s.replace('], providerTimeoutMs(a, true));', '], providerTimeoutMs(a, true, model));')

          p.write_text(s)

          # Remove accidental compatibility shim from models.ts; it adds no API value.
          mp = Path('src/lib/engine/models.ts')
          ms = mp.read_text()
          ms, n = re.subn(
              r'\nexport function isFunctionalRefinementLegacy\(message: string\): boolean \{\n  return isFunctionalRefinement\(message\);\n\}\n',
              '\n',
              ms,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'legacy shim removal mismatch: {n}')
          mp.write_text(ms)

          tp = Path('src/lib/engine/code-providers.test.ts')
          t = tp.read_text()
          old = 'import { providerSystemPrompt, qualityRepairInstruction } from "./code-providers";'
          new = 'import { modelOutputTokenBudget, providerSystemPrompt, qualityRepairInstruction } from "./code-providers";'
          if t.count(old) != 1:
              raise SystemExit('test import anchor mismatch')
          t = t.replace(old, new, 1)
          t += '''

          describe("orçamento adaptativo por modelo", () => {
            it("não repassa 24k para o fallback barato", () => {
              expect(modelOutputTokenBudget("Crie uma landing premium", false, "xiaomi/mimo-v2.5")).toBe(7000);
              expect(modelOutputTokenBudget("CONSTRUÇÃO POR ETAPAS — ETAPA 1/7", false, "xiaomi/mimo-v2.5")).toBe(3200);
              expect(modelOutputTokenBudget("CONSTRUÇÃO POR ETAPAS — ETAPA 2/7", true, "xiaomi/mimo-v2.5")).toBe(2200);
            });

            it("mantém o orçamento amplo do Sonnet e limita a rota free", () => {
              expect(modelOutputTokenBudget("Crie uma landing premium", false, "anthropic/claude-sonnet-4.5")).toBe(24000);
              expect(modelOutputTokenBudget("Crie uma landing premium", false, "openrouter/free")).toBe(4500);
            });
          });
          '''
          tp.write_text(t)

          for file in [p, mp, tp]:
              print(file)
          PY
          git diff --check
          git diff --stat
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/engine/code-providers.ts src/lib/engine/code-providers.test.ts src/lib/engine/models.ts
          git commit -m "fix: adapt OpenRouter token and timeout budgets"
          git push origin HEAD:fix/openrouter-adaptive-budget
      - name: Validate
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
          npm run build
