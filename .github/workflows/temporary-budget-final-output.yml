name: Temporary budget final output patch

on:
  push:
    branches:
      - fix/openrouter-budget-final-output

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final-output controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/engine/code-providers.ts')
          s = p.read_text()

          insert_at = s.index('function responseFormatSummary')
          controls = '''export function openRouterControlsForModel(model: string): Record<string, unknown> {
            // MiMo V2.5 permite desligar reasoning. Para geração de código, o teto
            // de saída deve ser preservado para o artefato final, não para thinking.
            if (/^xiaomi\\/mimo-v2\\.5(?:$|-)/.test(model)) {
              return { reasoning: { enabled: false }, temperature: 0.2 };
            }
            return {};
          }

          function openRouterEmptyResponseSummary(data: any): string {
            const choice = data?.choices?.[0];
            const message = choice?.message;
            const usage = data?.usage ?? {};
            const reasoningText = responseText(message?.reasoning);
            const reasoningDetails = Array.isArray(message?.reasoning_details) ? message.reasoning_details : [];
            const reasoningChars = reasoningText?.length ?? JSON.stringify(reasoningDetails).length;
            const reasoningTokens = usage?.completion_tokens_details?.reasoning_tokens
              ?? usage?.completionTokensDetails?.reasoningTokens
              ?? "?";
            return [
              `finish=${choice?.finish_reason ?? "?"}`,
              `completion_tokens=${usage?.completion_tokens ?? usage?.completionTokens ?? "?"}`,
              `reasoning_tokens=${reasoningTokens}`,
              `reasoning_chars=${reasoningChars}`,
            ].join(", ");
          }

          '''
          s = s[:insert_at] + controls + s[insert_at:]

          start = s.index('async function callOpenRouter')
          end = s.index('\nfunction demoFallback', start)
          block = s[start:end]
          body_anchor = '''        usage: { include: true },
                messages,
              }),'''
          if block.count(body_anchor) != 1:
              raise SystemExit(f'OpenRouter body anchor mismatch: {block.count(body_anchor)}')
          block = block.replace(body_anchor, '''        usage: { include: true },
                messages,
                ...openRouterControlsForModel(model),
              }),''', 1)
          empty_anchor = 'if (!text) { diag.push(`OpenRouter: ${model} respondeu vazio.`); return null; }'
          if block.count(empty_anchor) != 1:
              raise SystemExit(f'OpenRouter empty anchor mismatch: {block.count(empty_anchor)}')
          block = block.replace(empty_anchor, '''if (!text) {
                diag.push(`OpenRouter: ${model} respondeu vazio (${openRouterEmptyResponseSummary(data)}).`);
                return null;
              }''', 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)

          tp = Path('src/lib/engine/code-providers.test.ts')
          t = tp.read_text()
          old_import = 'import { modelOutputTokenBudget, providerSystemPrompt, qualityRepairInstruction } from "./code-providers";'
          new_import = 'import { modelOutputTokenBudget, openRouterControlsForModel, providerSystemPrompt, qualityRepairInstruction } from "./code-providers";'
          if t.count(old_import) != 1:
              raise SystemExit(f'test import mismatch: {t.count(old_import)}')
          t = t.replace(old_import, new_import, 1)
          t += '''

          describe("controles de saída do fallback OpenRouter", () => {
            it("desliga reasoning somente no MiMo para preservar tokens do código final", () => {
              expect(openRouterControlsForModel("xiaomi/mimo-v2.5")).toEqual({
                reasoning: { enabled: false },
                temperature: 0.2,
              });
              expect(openRouterControlsForModel("anthropic/claude-sonnet-4.5")).toEqual({});
              expect(openRouterControlsForModel("openrouter/free")).toEqual({});
            });
          });
          '''
          tp.write_text(t)
          PY
          git diff --check
          git diff --stat
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/engine/code-providers.ts src/lib/engine/code-providers.test.ts
          git commit -m "fix: reserve fallback tokens for final code output"
          git push origin HEAD:fix/openrouter-budget-final-output
      - name: Validate
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
          npm run build
