name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build e interações reais
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sincronizar lockfile da correção
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 68
        run: |
          npm install --package-lock-only
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Atualiza lockfile das dependências seguras"
            git push
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Bloquear vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Testar contratos, papéis e isolamento
        run: npm run test:unit

      - name: Compilar para produção
        run: npm run build

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testar login, menus, formulários, CRUD e navegação
        run: npm run test:e2e

      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
