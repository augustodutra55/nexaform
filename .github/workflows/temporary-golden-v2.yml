name: Temporary Golden 2.0 production certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/golden-certification-trigger"
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-golden-v2.yml"

permissions:
  contents: read

concurrency:
  group: golden-production-certification-v2
  cancel-in-progress: false

jobs:
  golden:
    name: 5 apps reais · semântica e runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRODUCTION_URL: https://nexaform-rho.vercel.app
      # Projeto antigo, não publicado e pertencente ao owner. A rota Golden
      # apenas valida a propriedade; ela não persiste o app gerado no projeto.
      AD_GOLDEN_PROJECT_ID: f7f68e5d-08ea-4c3f-b1fa-fc127b46a92e
      AD_GOLDEN_SERVICE_SECRET: ${{ secrets.AD_GOLDEN_SERVICE_SECRET }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar avaliador e runtime
        run: npm ci

      - name: Verificar credencial de serviço
        shell: bash
        run: |
          if [ -z "$AD_GOLDEN_SERVICE_SECRET" ]; then
            echo "::error::AD_GOLDEN_SERVICE_SECRET ausente."
            exit 1
          fi

      - name: Gerar e avaliar requisitos
        run: node scripts/golden-production.mjs

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Compilar e exercitar os cinco apps gerados
        env:
          E2E_TEST_MODE: "1"
          GOLDEN_FIXTURE_PATH: artifacts/golden-apps.json
        run: npx playwright test tests/e2e/golden-generated.spec.ts

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-v2-production-certification-report
          path: |
            artifacts/golden-production.json
            artifacts/golden-apps.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar evidências do runtime em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-v2-runtime-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
