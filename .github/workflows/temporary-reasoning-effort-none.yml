name: Temporary reasoning effort none patch

on:
  push:
    branches:
      - fix/openrouter-reasoning-effort-none

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply documented reasoning disable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('src/lib/engine/code-providers.ts'),
              Path('src/lib/engine/code-providers.test.ts'),
          ]
          old = 'reasoning: { enabled: false }'
          new = 'reasoning: { effort: "none" }'
          total = 0
          for path in files:
              text = path.read_text()
              count = text.count(old)
              if count:
                  text = text.replace(old, new)
                  path.write_text(text)
                  total += count
          if total != 2:
              raise SystemExit(f'expected exactly 2 reasoning replacements, got {total}')

          p = Path('src/lib/engine/code-providers.ts')
          s = p.read_text()
          s = s.replace(
              '// MiMo V2.5 permite desligar reasoning. Para geração de código, o teto\n  // de saída deve ser preservado para o artefato final, não para thinking.',
              '// O OpenRouter documenta `reasoning.effort = "none"` para desligar reasoning.\n  // Assim o teto de completion fica reservado para o código final, não para thinking.',
              1,
          )
          p.write_text(s)
          PY
          git diff --check
          git diff --stat
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/engine/code-providers.ts src/lib/engine/code-providers.test.ts
          git commit -m "fix: disable MiMo reasoning with documented effort none"
          git push origin HEAD:fix/openrouter-reasoning-effort-none
      - name: Validate
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
          npm run build
