name: Temporary Golden 2.0 production certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/golden-certification-trigger"
      - ".github/workflows/temporary-golden-v2.yml"
      - "scripts/golden-production.mjs"
      - "tests/e2e/golden-generated.spec.ts"
      - "src/app/api/app-auth/**"
      - "src/app/e2e-runtime/golden/**"
      - "src/components/preview/**"
      - "src/lib/golden-auth.ts"
      - "src/lib/preview/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-golden-v2.yml"
      - "scripts/golden-production.mjs"
      - "tests/e2e/golden-generated.spec.ts"
      - "src/app/api/app-auth/**"
      - "src/app/e2e-runtime/golden/**"
      - "src/components/preview/**"
      - "src/lib/golden-auth.ts"
      - "src/lib/preview/**"

permissions:
  contents: read
  deployments: read

concurrency:
  group: golden-production-certification-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: 5 apps reais · semântica e runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRODUCTION_URL: https://nexaform-rho.vercel.app
      # Projeto antigo, não publicado e pertencente ao owner. A rota Golden
      # apenas valida a propriedade; ela não persiste o app gerado no projeto.
      AD_GOLDEN_PROJECT_ID: f7f68e5d-08ea-4c3f-b1fa-fc127b46a92e
      AD_GOLDEN_SERVICE_SECRET: ${{ secrets.AD_GOLDEN_SERVICE_SECRET }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar avaliador e runtime
        run: npm ci

      - name: Verificar credencial de serviço
        shell: bash
        run: |
          if [ -z "$AD_GOLDEN_SERVICE_SECRET" ]; then
            echo "::error::AD_GOLDEN_SERVICE_SECRET ausente."
            exit 1
          fi

      - name: Resolver backend real da revisão Vercel
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          TARGET_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            deployment_id="$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$TARGET_SHA&per_page=100" \
              --jq "[.[] | select((.environment | ascii_downcase) == \"$TARGET_ENV\")][0].id // empty")"
            if [ -n "$deployment_id" ]; then
              runtime_url="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=100" \
                --jq '[.[] | select(.state == "success" and (.environment_url // "") != "")][0].environment_url // empty')"
              if [ -n "$runtime_url" ]; then
                echo "GOLDEN_RUNTIME_API_URL=$runtime_url" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Preview Vercel verde não foi encontrado para $TARGET_SHA."
          exit 1

      - name: Usar produção no disparo manual
        if: github.event_name == 'workflow_dispatch'
        run: echo "GOLDEN_RUNTIME_API_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"

      - name: Gerar e avaliar requisitos
        run: node scripts/golden-production.mjs

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Compilar e exercitar os cinco apps gerados
        env:
          E2E_TEST_MODE: "1"
          GOLDEN_FIXTURE_PATH: artifacts/golden-apps.json
        run: npx playwright test tests/e2e/golden-generated.spec.ts

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-v2-production-certification-report
          path: |
            artifacts/golden-production.json
            artifacts/golden-apps.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar evidências do runtime em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-v2-runtime-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
