name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Build, contratos e componentes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Bloquear vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Testar contratos, papéis e isolamento
        run: npm run test:unit

      - name: Compilar para produção
        run: npm run build

  interactions:
    name: Interações reais no navegador
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testar login, menus, formulários, CRUD, mobile e editor visual
        run: npm run test:e2e

      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7

  style-migration:
    name: Comparação visual Tailwind 3 → 4
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/tailwind-v4-migration'
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar a revisão exata e a referência anterior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências e Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Preparar referência Tailwind 3 isolada
        env:
          STUDIO_BASELINE: ${{ runner.temp }}/studio-v3
        run: |
          git worktree add --detach "$STUDIO_BASELINE" 46258b28360bfe4d859dbd731cb5ad16d31a0f2b
          cp -R src/app/e2e-runtime/styles "$STUDIO_BASELINE/src/app/e2e-runtime/"
          npm ci --prefix "$STUDIO_BASELINE" --no-audit

      - name: Capturar versão anterior
        env:
          STUDIO_STYLE_PORT: 3101
        run: node scripts/verify-studio-styles.mjs "$RUNNER_TEMP/studio-v3" artifacts/studio-before

      - name: Capturar versão migrada
        env:
          STUDIO_STYLE_PORT: 3102
        run: node scripts/verify-studio-styles.mjs . artifacts/studio-after

      - name: Bloquear mudanças de cores, dimensões e espaçamentos
        run: node scripts/compare-studio-styles.mjs artifacts/studio-before artifacts/studio-after

      - name: Guardar imagens e medidas para revisão visual
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comparacao-visual-tailwind
          path: artifacts/studio-*/
          retention-days: 14
