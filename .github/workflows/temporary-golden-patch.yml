name: Temporary Golden deterministic patch

on:
  push:
    branches:
      - fix-golden-deterministic-output

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply root-cause patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY' 2>&1 | tee artifacts/patch-apply.txt
          from pathlib import Path
          import re

          path = Path('src/lib/engine/code-providers.ts')
          text = path.read_text()

          system_replacement = '''const INITIAL_BLOCK_TRANSPORT = `=== FORMATO FINAL DE TRANSPORTE — TEM PRIORIDADE SOBRE QUALQUER FORMATO ANTERIOR ===
          Na PRIMEIRA geração, NÃO retorne JSON e NÃO coloque código em cercas Markdown. Entregue cada arquivo como texto bruto em um bloco AD_FILE:
          <AD_FILE path="App.jsx" op="create">
          conteúdo completo do arquivo
          </AD_FILE>
          <AD_FILE path="components/Exemplo.jsx" op="create">
          conteúdo completo do arquivo
          </AD_FILE>
          Finalize opcionalmente com <AD_REPLY>resumo curto em pt-BR</AD_REPLY>.
          Todos os arquivos necessários devem ser completos e autoconsistentes. App.jsx continua sendo a entrada inferida automaticamente.
          ESTA REGRA SUBSTITUI qualquer instrução anterior que peça JSON para a resposta final.`;

          export function providerSystemPrompt(hasCurrentProject: boolean): string {
            if (hasCurrentProject) return CODE_REFINE_SYSTEM_PROMPT;
            return `${CODE_SYSTEM_PROMPT}\\n\\n${INITIAL_BLOCK_TRANSPORT}`;
          }

          function systemPromptFor(a: Args): string {
            return providerSystemPrompt(!!(a.currentFiles?.length || a.currentCode));
          }'''
          text, n = re.subn(
              r'function systemPromptFor\(a: Args\): string \{\n\s*return a\.currentFiles\?\.length \|\| a\.currentCode \? CODE_REFINE_SYSTEM_PROMPT : CODE_SYSTEM_PROMPT;\n\}',
              lambda _: system_replacement,
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'system prompt transport: expected 1 replacement, got {n}')

          quality_replacement = '''export function qualityRepairInstruction(a: Pick<Args, "message" | "currentFiles" | "currentCode">, report: ProjectQualityReport): string {
            const failures = report.errors.map((value) => `- ${value.path ? `${value.path}: ` : ""}${value.message}`).join("\\n");
            const format = a.currentFiles?.length || a.currentCode
              ? "Reenvie somente AD_PATCH/AD_FILE/AD_DELETE válidos contra o projeto original, seguidos de AD_REPLY. Faça a menor correção possível e não reenvie arquivos inalterados."
              : "O projeto ainda está vazio. Reenvie cada arquivo completo em blocos AD_FILE com op=\\\"create\\\", seguidos de AD_REPLY. Não use JSON, Markdown nem AD_PATCH.";
            return [
              "QUALITY GATE: o código anterior foi recusado antes de ser salvo.",
              failures,
              "Corrija somente essas falhas, preserve o escopo e confira todos os imports relativos.",
              format,
            ].join("\\n\\n");
          }

          function claudeUserContent'''
          text, n = re.subn(
              r'export function qualityRepairInstruction\([\s\S]*?\n\}\n\nfunction claudeUserContent',
              lambda _: quality_replacement,
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'quality repair format: expected 1 replacement, got {n}')

          timeout_replacement = '''function providerTimeoutMs(a: Args, repair = false): number {
            const isRefinement = !!(a.currentFiles?.length || a.currentCode);
            const isStaged = /(?:CONSTRUÇÃO|REFINAMENTO) POR ETAPAS|RECUPERAÇÃO AUTOMÁTICA/.test(a.message);
            // Etapas pequenas têm orçamento total de 130 s: 80 s para a primeira
            // passagem e 50 s para o reparo dirigido. Isso preserva margem real
            // dentro do worker de 140 s em vez de abortar o reparo aos 35 s.
            if (isStaged) return repair ? 50_000 : 80_000;
            if (isRefinement) return repair ? 60_000 : 90_000;
            // Primeira geração simples: se o transporte vier inválido, um reparo
            // de 70 s ainda cabe na rota de 280 s sem repetir toda a geração.
            if (repair) return 70_000;
            return 180_000;
          }

          function responseText'''
          text, n = re.subn(
              r'function providerTimeoutMs\(a: Args, repair = false\): number \{[\s\S]*?\n\}\n\nfunction responseText',
              lambda _: timeout_replacement,
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'provider timeout budget: expected 1 replacement, got {n}')

          repair_pattern = re.compile(
              r'    const shouldRepair = isRefinement \|\| /\(\?:CONSTRUÇÃO\|REFINAMENTO\) POR ETAPAS\|RECUPERAÇÃO AUTOMÁTICA/\.test\(a\.message\);\n'
              r'    if \(!shouldRepair\) \{\n'
              r'      diag\.push\(`(?:Claude|OpenRouter): resposta de \$\{model\} não pôde ser interpretada como código \(\$\{responseFormatSummary\(text\)\}\)\.`\);\n'
              r'      return null;\n'
              r'    \}\n\n'
          )
          text, n = repair_pattern.subn(
              '    // Toda resposta não vazia recebe UMA correção de transporte antes de desistirmos;\n'
              '    // repetir a geração inteira duplica custo e latência sem atacar a causa.\n',
              text,
          )
          if n != 2:
              raise SystemExit(f'format repair policy: expected 2 replacements, got {n}')

          if text.count('const attempts = premiumOnly ? 1 : !isRefinement ? 2 : 1;') != 1:
              raise SystemExit('provider attempt policy anchor not unique')
          text = text.replace(
              'const attempts = premiumOnly ? 1 : !isRefinement ? 2 : 1;',
              'const attempts = 1;',
              1,
          )
          text = text.replace(
              '// Refinamento: 1 tentativa no principal (rápido, cabe nos 60s do Hobby).\n      // Primeira geração: 2 tentativas (mais robusto, vale a espera).',
              '// Cada chamada já inclui no máximo uma passagem dirigida de quality/format repair.\n      // Repetir toda a geração mascarava a causa e duplicava custo/latência.',
              1,
          )

          path.write_text(text)

          test_path = Path('src/lib/engine/code-providers.test.ts')
          test = test_path.read_text()
          old_import = 'import { qualityRepairInstruction } from "./code-providers";'
          if test.count(old_import) != 1:
              raise SystemExit('test import anchor not unique')
          test = test.replace(
              old_import,
              'import { providerSystemPrompt, qualityRepairInstruction } from "./code-providers";',
              1,
          )
          test += '''

          describe("contrato determinístico de saída", () => {
            it("usa AD_FILE no reparo de uma primeira geração simples", () => {
              const instruction = qualityRepairInstruction({
                message: "Crie uma landing premium para consultoria",
                currentFiles: null,
                currentCode: null,
              }, report);
              expect(instruction).toContain("AD_FILE");
              expect(instruction).toContain("Não use JSON");
              expect(instruction).not.toContain("JSON files obrigatório");
            });

            it("faz AD_FILE prevalecer depois da antiga instrução JSON", () => {
              const prompt = providerSystemPrompt(false);
              const jsonInstruction = prompt.indexOf("Responda APENAS com JSON válido");
              const transportOverride = prompt.indexOf("FORMATO FINAL DE TRANSPORTE");
              expect(jsonInstruction).toBeGreaterThanOrEqual(0);
              expect(transportOverride).toBeGreaterThan(jsonInstruction);
              expect(prompt.slice(transportOverride)).toContain('<AD_FILE path="App.jsx" op="create">');
              expect(prompt.slice(transportOverride)).toContain("SUBSTITUI qualquer instrução anterior");
            });
          });
          '''
          test_path.write_text(test)

          required = [
              'FORMATO FINAL DE TRANSPORTE',
              'if (isStaged) return repair ? 50_000 : 80_000;',
              'if (repair) return 70_000;',
              'const attempts = 1;',
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f'missing postcondition: {value}')
          print('PATCH_APPLY=PASS')
          PY

          git diff --check
          git diff --stat

      - name: Commit root-cause patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/engine/code-providers.ts src/lib/engine/code-providers.test.ts
          git commit -m "fix: make generation output deterministic"
          git push origin HEAD:fix-golden-deterministic-output

      - name: Validate patch
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          : > artifacts/golden-patch-validation.txt
          overall=0
          run_cmd() {
            label="$1"
            shift
            echo "===== $label =====" | tee -a artifacts/golden-patch-validation.txt
            "$@" >> artifacts/golden-patch-validation.txt 2>&1
            status=$?
            echo "EXIT=$status" | tee -a artifacts/golden-patch-validation.txt
            if [ "$status" -ne 0 ]; then overall=1; fi
          }
          run_cmd "npm ci" npm ci
          run_cmd "npm run typecheck" npm run typecheck
          run_cmd "npm run test:unit" npm run test:unit
          run_cmd "npm run build" npm run build
          exit "$overall"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-deterministic-patch-validation
          path: artifacts/*.txt
          if-no-files-found: warn
